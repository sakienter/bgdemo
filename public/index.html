<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>バトグラ最強決定戦2026</title>
  <meta name="description" content="バトグラ最強決定戦2026の大会結果ページです。Googleスプレッドシート由来のデータをJSONとして読み込み、公開用のポイント集計と順位集計として表示します。" />

  <meta property="og:title" content="バトグラ最強決定戦2026" />
  <meta property="og:description" content="バトグラ最強決定戦2026のポイント集計・順位集計ページ" />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">Battlegrounds Championship</p>

      <h1 id="event-title">バトグラ最強決定戦2026</h1>

      <p class="lead">
        時渡ドリームマッチや裏頂上戦の結果ページと同じく、スプレッドシートで管理した試合結果を読み込み、各試合のポイントと順位を一覧で確認できる公開ページです。
      </p>

      <div class="meta-line">
        <span id="data-status">読み込み中...</span>
        <span id="updated-at"></span>
      </div>
    </header>

    <section class="score-card">
      <div class="section-title purple">ポイント集計</div>

      <div class="table-wrap">
        <table id="points-table" aria-label="ポイント集計表">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="score-card">
      <div class="section-title orange">順位集計</div>

      <div class="table-wrap">
        <table id="placements-table" aria-label="順位集計表">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <footer class="footer-note">
      <p>
        表示データは <code>public_data</code> シートから Apps Script を経由して取得します。
        本番反映前の確認では <code>sample-data.json</code> の雛形データが表示されます。
      </p>
    </footer>
  </main>

  <script src="./script.js"></script>
</body>
</html>
