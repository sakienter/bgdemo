<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CNvsAmericans CC</title>
  <meta name="description" content="Googleスプレッドシート由来のJSONを表示するCloudflare Pages用デモサイト" />
  <meta property="og:title" content="CNvsWorld Result Demo" />
  <meta property="og:description" content="スプレッドシート風の大会結果公開ページ" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">Cloudflare Pages Demo</p>
      <h1 id="event-title">CNvsWorld Result Demo</h1>
      <p class="lead">Googleスプレッドシートで編集したデータをJSONとして読み込み、公開用の表として表示する想定のデモです。</p>
      <div class="meta-line">
        <span id="data-status">読み込み中...</span>
        <span id="updated-at"></span>
      </div>
    </header>

    <section class="score-card">
      <div class="section-title purple">ポイント集計</div>
      <div class="table-wrap">
        <table id="points-table" aria-label="ポイント集計表">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="score-card">
      <div class="section-title orange">順位集計</div>
      <div class="table-wrap">
        <table id="placements-table" aria-label="順位集計表">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <footer class="footer-note">
      <p>実運用では、<code>public_data</code> シート → Apps Script → <code>/api/results</code> → この画面、という流れにします。</p>
    </footer>
  </main>

  <script src="./script.js"></script>
</body>
</html>
